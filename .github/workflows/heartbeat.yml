name: FullSend heartbeat

# Drives FullSend's background jobs. This is the scheduler.
#
# It lives here rather than in vercel.json because Vercel's Hobby plan refuses
# any cron that runs more than once a day — and refuses it at deploy time, so a
# vercel.json asking for a one-minute schedule blocks the deploy outright.
# Running the schedule from Actions means FullSend deploys and works on every
# Vercel plan, with no configuration.
#
# On Vercel Pro you can move this back to native crons if you prefer — see
# "Using Vercel's own cron jobs instead" in the README. Disable this workflow
# from the Actions tab if you do, so the jobs are not driven twice.
#
# Setup (all in the browser, no terminal):
#   Repo → Settings → Secrets and variables → Actions → New repository secret
#     FULLSEND_URL     https://your-app.vercel.app
#     FULLSEND_CRON_SECRET   the same value as CRON_SECRET in Vercel
#
# How often this really runs, which is not what the schedule below says.
# GitHub throttles scheduled workflows on quiet repositories: the '*/5' entry
# asks for every five minutes and is fired anywhere from 45 minutes to several
# hours apart. Rather than pretend otherwise, the queue run stays up and
# sweeps continuously until the next firing replaces it, so coverage comes
# from the length of a run rather than the punctuality of the schedule.
#
# That is free on a public repository, where Actions minutes are unmetered. On
# a PRIVATE repository those hours are billed against your Actions allowance —
# shorten the sweep deadline below, or drive the queue from an external pinger
# instead ("Driving the queue from outside GitHub" in the README).

on:
  schedule:
    # Drain the job queue and publish anything due. Asks for every five
    # minutes; see the note above for what GitHub actually does with that.
    - cron: '*/5 * * * *'
    # Once a day: the full autopilot loop.
    - cron: '0 7 * * *'
    # Mondays: the Weekly Send Report.
    - cron: '0 8 * * 1'
    # Every six hours: check platform connections and refresh tokens.
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      job:
        description: 'Run one job now'
        required: true
        default: 'queue'
        type: choice
        options: [queue, publish, daily, weekly, health]

# One sweeper at a time, and the newest one wins.
#
# The queue sweep below runs for hours rather than minutes, so without this a
# schedule that fires while one is running would stack them up. Cancelling the
# old one instead means each firing simply restarts the clock: however erratic
# the schedule turns out to be, there is exactly one sweeper and it is always
# the freshest. The other jobs get their own groups so a daily or weekly run
# never cancels the sweeper.
concurrency:
  group: fullsend-heartbeat-${{ inputs.job || github.event.schedule }}
  cancel-in-progress: true

jobs:
  # ── Preflight ──────────────────────────────────────────────────────────────
  #
  # Says which deployment this heartbeat is actually driving, and whether its
  # secret is accepted there. It is a separate job for one reason: the sweep
  # below runs for hours, and a workflow's logs cannot be read until the job
  # holding them finishes. A question that takes seconds to answer should not
  # be locked inside a five-hour run.
  #
  # It exists because that question went unanswered for a whole evening. The
  # sweep polled happily and the queue never moved, and "is it even talking to
  # the right deployment" was the one assumption nothing could check — the
  # secret is opaque by design, and a wrong URL that still answers 200 looks
  # exactly like a right one.
  #
  # Nothing secret is printed. `appUrl` comes from the deployment's own public
  # health endpoint, and the queue response is job counts.
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Report which deployment this heartbeat drives
        env:
          URL: ${{ secrets.FULLSEND_URL }}
          SECRET: ${{ secrets.FULLSEND_CRON_SECRET }}
        run: |
          if [ -z "$URL" ] || [ -z "$SECRET" ]; then
            echo "::error::Set the FULLSEND_URL and FULLSEND_CRON_SECRET repository secrets first."
            exit 1
          fi

          # See the note on `base` in the ping job below: an origin Vercel
          # redirects answers 308, which curl reports as a perfectly
          # successful request unless the status is checked by hand.
          base="${URL%/}"
          echo "── the deployment FULLSEND_URL resolves to"
          landed=$(curl --silent --show-error --location --max-time 30 \
                        --output /tmp/health.json --write-out '%{url_effective}' \
                        "$base/api/health" || echo '')
          case "$landed" in
            */api/health)
              if [ "${landed%/api/health}" != "$base" ]; then
                # Not fatal — the sweep resolves it the same way and works
                # regardless — but it is the fault that stalled the queue for
                # days, so it gets said out loud with the value to paste.
                echo "::warning::FULLSEND_URL redirects. The heartbeat follows it, but set the secret to ${landed%/api/health} to stop paying for a redirect on every call."
              fi
              base="${landed%/api/health}"
              ;;
          esac
          echo "base:     $base"
          echo "appUrl:   $(jq -r '.appUrl // "unreachable"' /tmp/health.json 2>/dev/null)"
          echo "database: $(jq -r '.database // "unknown"' /tmp/health.json 2>/dev/null)"
          echo "queue:    $(jq -c '.queue // "not reported"' /tmp/health.json 2>/dev/null)"

          echo
          echo "── whether the cron secret is accepted there"
          # No --location here, deliberately. The request carries the cron
          # secret, and a redirect is exactly the thing you do not follow with
          # a credential attached. `base` is already the canonical origin, so
          # a redirect at this point is a fault worth reporting rather than
          # something to chase.
          code=$(curl --silent --output /tmp/cron.json --write-out '%{http_code}' \
                      --max-time 60 -H "Authorization: Bearer $SECRET" \
                      "$base/api/cron/queue" || echo 000)
          echo "GET /api/cron/queue -> HTTP $code"
          echo "response: $(head -c 500 /tmp/cron.json 2>/dev/null)"

          case "$code" in
            200) echo "The heartbeat reaches this deployment and its secret is accepted." ;;
            401) echo "::error::FULLSEND_CRON_SECRET does not match CRON_SECRET on the deployment at FULLSEND_URL." ; exit 1 ;;
            000) echo "::error::FULLSEND_URL is unreachable." ; exit 1 ;;
            30*) echo "::error::The cron endpoint redirected ($code). Set FULLSEND_URL to the exact origin the deployment reports as appUrl above — no trailing slash, https, no www unless that is the canonical host." ; exit 1 ;;
            *)   echo "::error::Unexpected status $code from the cron endpoint." ; exit 1 ;;
          esac

  ping:
    runs-on: ubuntu-latest
    # A sweep runs until GitHub's job ceiling or the next firing replaces it.
    timeout-minutes: 350
    # Nothing here touches the repository.
    permissions: {}
    steps:
      - name: Work out which jobs this run should trigger
        id: plan
        env:
          CRON: ${{ github.event.schedule }}
          MANUAL: ${{ inputs.job }}
        run: |
          if [ -n "$MANUAL" ]; then
            echo "jobs=$MANUAL" >> "$GITHUB_OUTPUT"
          else
            case "$CRON" in
              '*/5 * * * *')  echo "jobs=queue publish" >> "$GITHUB_OUTPUT" ;;
              '0 7 * * *')    echo "jobs=daily"         >> "$GITHUB_OUTPUT" ;;
              '0 8 * * 1')    echo "jobs=weekly"        >> "$GITHUB_OUTPUT" ;;
              '0 */6 * * *')  echo "jobs=health"        >> "$GITHUB_OUTPUT" ;;
              *)              echo "jobs=queue"         >> "$GITHUB_OUTPUT" ;;
            esac
          fi

      - name: Call FullSend
        env:
          URL: ${{ secrets.FULLSEND_URL }}
          SECRET: ${{ secrets.FULLSEND_CRON_SECRET }}
          JOBS: ${{ steps.plan.outputs.jobs }}
        run: |
          if [ -z "$URL" ] || [ -z "$SECRET" ]; then
            echo "::error::Set the FULLSEND_URL and FULLSEND_CRON_SECRET repository secrets first."
            exit 1
          fi

          # ── Where to send the heartbeat ──────────────────────────────────
          #
          # This heartbeat ran for days without a single failed poll while the
          # queue did not move, and this is why: FULLSEND_URL answers 308.
          # curl does not follow a redirect unless told to, and a 308 is not an
          # error — not even to --fail-with-body, which fails on 4xx and 5xx
          # and waves a 3xx through. So every call returned exit 0 with a body
          # of "Redirecting...", `.processed` parsed as 0, and the sweep
          # concluded the queue was idle. A misconfiguration was wearing the
          # exact costume of a healthy system, which is why four fixes aimed at
          # the queue itself all missed: the queue was never being asked.
          #
          # Vercel answers 308 for any origin that is not the canonical one —
          # http:// rather than https, a www/apex mismatch, a deployment alias
          # pointing at the production domain — and there is nothing anywhere
          # that tells you the URL you saved was one of those.
          #
          # So the origin is resolved before anything is sent: follow the
          # redirects on the *public* health endpoint and keep whatever origin
          # they land on. The authenticated calls below then address an origin
          # already known to be canonical, and no redirect is ever followed
          # with the secret attached — `--location-trusted`, which would hand
          # the header to whatever host a redirect names, appears nowhere.
          #
          # Verified against a stub that 308s to a second origin, reproducing
          # the production log line for line: the old form polls "processed=0"
          # forever and never fails, `--location` alone gets a 401 because curl
          # drops the credential across hosts, and this form drains the queue.
          #
          # The trailing slash is stripped first. curl collapses the resulting
          # doubled slash on its own, so it is not the fault here — but it
          # would otherwise make an origin look like it redirects when the only
          # thing that changed was the spelling.
          base="${URL%/}"
          landed=$(curl --silent --show-error --location --max-time 30 \
                        --output /dev/null --write-out '%{url_effective}' \
                        "$base/api/health" || echo '')
          case "$landed" in
            */api/health)
              if [ "${landed%/api/health}" != "$base" ]; then
                echo "::warning::FULLSEND_URL redirects; using the canonical origin it lands on instead."
              fi
              base="${landed%/api/health}"
              ;;
          esac

          # The response body goes to stdout so a caller can read it; anything
          # meant for a human goes to stderr, which keeps `$(call queue)` clean
          # enough to hand to jq.
          #
          # Status is checked explicitly rather than left to --fail-with-body,
          # which fails on 4xx and 5xx but waves a 3xx through. Only 200 is
          # this endpoint doing its job; everything else is a failure and says
          # so, which is the guarantee that a silent no-op cannot come back.
          call() {
            echo "── $1" >&2
            code=$(curl --silent --show-error \
                        --max-time 300 --retry 2 --retry-delay 10 \
                        -H "Authorization: Bearer $SECRET" \
                        --output /tmp/cron-body --write-out '%{http_code}' \
                        "$base/api/cron/$1" || echo 000)
            cat /tmp/cron-body 2>/dev/null
            if [ "$code" != "200" ]; then
              echo >&2
              echo "::error::/api/cron/$1 returned HTTP $code" >&2
              return 1
            fi
          }

          failed=0
          for job in $JOBS; do
            call "$job" || { echo "::error::$job failed"; failed=1; }
            echo
          done

          # ── The sweep ────────────────────────────────────────────────────
          #
          # GitHub does not honour '*/5' on a repository this quiet. The run
          # history on this one says these fire 45 minutes to 4 hours apart.
          # That is not a schedule FullSend can be built on: a queue drained
          # once every few hours is a machine that looks broken between
          # drains, because it is not doing anything.
          #
          # The schedule is not ours to fix. The length of a run is. So a run
          # does not do five minutes of work and exit — it stays up and keeps
          # sweeping until GitHub's job ceiling or until the next firing
          # cancels it (see `concurrency` above). Coverage then comes from the
          # runs being long rather than from the schedule being punctual.
          #
          # This repository is public, so Actions minutes are free and
          # unmetered. On a private repository they are not: see the README
          # before leaving this running.
          #
          # Each call is still a bounded worker pass — a few AI generations at
          # most, then it returns — so no single request ever grows long
          # enough to be killed.
          if echo "$JOBS" | grep -q queue; then
            # Poll briskly while there is work, and back off when there is
            # none: an idle queue should cost the deployment one cheap request
            # a minute, not one every fifteen seconds.
            BUSY_SLEEP=15
            IDLE_SLEEP=60
            consecutive_failures=0

            # Leaves margin under the job timeout so the run ends on its own
            # terms rather than being killed mid-request.
            deadline=$(( $(date +%s) + 340 * 60 ))

            # Quiet variant: a six-hour loop logging every poll would bury the
            # one line that matters. Only passes that did something are worth
            # a line in the log.
            sweep() {
              code=$(curl --silent --show-error \
                          --max-time 300 --retry 2 --retry-delay 10 \
                          -H "Authorization: Bearer $SECRET" \
                          --output /tmp/sweep-body --write-out '%{http_code}' \
                          "$base/api/cron/queue" || echo 000)
              cat /tmp/sweep-body 2>/dev/null
              [ "$code" = "200" ]
            }

            while [ "$(date +%s)" -lt "$deadline" ]; do
              if body=$(sweep); then
                consecutive_failures=0
                processed=$(printf '%s' "$body" | jq -r '.processed // 0' 2>/dev/null || echo 0)
                case "$processed" in ''|*[!0-9]*) processed=0 ;; esac
                if [ "$processed" -gt 0 ]; then
                  echo "$(date -u +%H:%M:%S) $body"
                  sleep "$BUSY_SLEEP"
                else
                  sleep "$IDLE_SLEEP"
                fi
              else
                # A blip is not worth failing a six-hour run over, but a
                # deployment that is down, or a secret that is wrong, is —
                # and it looks exactly like this, over and over.
                consecutive_failures=$(( consecutive_failures + 1 ))
                echo "::warning::queue sweep failed ($consecutive_failures in a row)"
                if [ "$consecutive_failures" -ge 10 ]; then
                  echo "::error::queue sweep failed 10 times in a row — check FULLSEND_URL and FULLSEND_CRON_SECRET"
                  failed=1
                  break
                fi
                sleep "$IDLE_SLEEP"
              fi
            done
          fi

          exit $failed
